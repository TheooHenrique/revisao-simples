on:
  push:
    branch: main
  pull_request:

jobs:
  teste:
    runs-on: alpine-latest 
    steps:
      - uses: actions/checkout@v7
      - uses: setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          pip install -r requirements-dev.txt
          ruff check .
          pytest -v.